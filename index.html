    <script>
      (function () {
        var root = document.documentElement;
        // Language comes from the URL: /en/... and /de/..., everything else is Bosnian
        var lang = location.pathname.match(/^\/(en|de)(\/|$)/);
        if (lang) root.lang = lang[1];

        // Apply the stored / system theme before first paint to avoid a flash.
        try {
          var stored = localStorage.getItem('spf-theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* storage unavailable, the CSS media query fallback applies */
        }

        // The home page opens on a full-bleed photo: start fetching the right crop before the app boots.
        if (/^\/(en|de)?\/?$/.test(location.pathname)) {
          var phone = window.matchMedia('(max-width: 767px)').matches;
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.type = 'image/avif';
          link.setAttribute('fetchpriority', 'high');
          link.setAttribute('imagesizes', '100vw');
          link.setAttribute(
            'imagesrcset',
            phone
              ? '/photos/jet-portrait-480.avif 480w, /photos/jet-portrait-800.avif 800w, /photos/jet-portrait-1000.avif 1000w'
              : '/photos/jet-800.avif 800w, /photos/jet-1200.avif 1200w, /photos/jet-1600.avif 1600w, /photos/jet-2000.avif 2000w',
          );
          document.head.appendChild(link);
        }
      })();
    </script>
