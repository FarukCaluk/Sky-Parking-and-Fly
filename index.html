    <script>
      (function () {
        var root = document.documentElement;
        // Apply the stored / system theme before first paint to avoid a flash.
        try {
          var stored = localStorage.getItem('spf-theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* storage unavailable, the CSS media query fallback applies */
        }
        // Barlow Condensed is embedded in the stylesheet, but the browser still has to decode it, which it does after the
        // first layout. Text drawn in a stand-in face and redrawn in Barlow a moment later would move everything around
        // it, so the first paint waits for those few milliseconds. Whatever happens, the page is shown after 250 ms.
        try {
          if (document.fonts) {
            root.classList.add('fonts-wait');
            var show = function () {
              root.classList.remove('fonts-wait');
            };
            Promise.all([
              document.fonts.load('800 1em "Barlow Condensed"'),
              document.fonts.load('700 1em "Barlow Condensed"'),
            ]).then(show, show);
            setTimeout(show, 250);
          }
        } catch (e) {
          /* no font loading API: the text simply appears as it is */
        }
      })();
    </script>
